apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-o-api
  namespace: agent-o
spec:
  replicas: 2
  selector: { matchLabels: { app: agent-o-api } }
  template:
    metadata: { labels: { app: agent-o-api } }
    spec:
      containers:
      - name: api
        image: ghcr.io/example/agent-o-api:latest
        ports: [{containerPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: agent-o-api
  namespace: agent-o
spec:
  selector: { app: agent-o-api }
  ports: [{ port: 80, targetPort: 8000 }]
